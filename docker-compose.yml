version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: travelreview_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: travel_review
    volumes:
      - mongo_data:/data/db
      - ./database/mongodb:/docker-entrypoint-initdb.d
    networks:
      - travelreview_network

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: travelreview_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --requirepass redispassword123
    volumes:
      - redis_data:/data
    networks:
      - travelreview_network

  # Neo4j Service
  neo4j:
    image: neo4j:5-community
    container_name: travelreview_neo4j
    restart: always
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./database/neo4j:/var/lib/neo4j/import
    networks:
      - travelreview_network

  # Backend Service (Uncomment and configure when ready)
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: travelreview_backend
  #   restart: unless-stopped
  #   ports:
  #     - "5000:5000"
  #   depends_on:
  #     - mongodb
  #     - redis
  #     - neo4j
  #   networks:
  #     - travelreview_network

  # Frontend Service (Uncomment and configure when ready)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: travelreview_frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   networks:
  #     - travelreview_network

volumes:
  mongo_data:
  redis_data:
  neo4j_data:
  neo4j_logs:

networks:
  travelreview_network:
    driver: bridge
